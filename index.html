<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e3001b">
<title>Baustelle · Malerbetrieb Bäßgen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rot-hell:#e3001b;
  --rot-dunkel:#a10e1e;
  --verlauf:linear-gradient(135deg,#e3001b 0%,#a10e1e 100%);
  --tinte:#14161a;
  --grau:#5d636e;
  --linie:#e3e5e9;
  --flaeche:#f4f5f7;
  --papier:#fff;
  --laeuft:#1f7a45;
  --arbeit:#b26a00;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--flaeche);color:var(--tinte);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
.streifen{height:5px;background:var(--verlauf)}

.kopf{
  background:var(--papier);border-bottom:1px solid var(--linie);
  padding:14px 16px;display:flex;align-items:center;gap:14px;
}
.kopf img{height:50px;width:auto;display:block;flex:none}
.kopf-eyebrow{
  font-family:'Oswald',sans-serif;font-weight:500;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--grau);
}
.kopf-titel{font-family:'Oswald',sans-serif;font-weight:600;font-size:21px;line-height:1.15}

main{max-width:820px;margin:0 auto;padding:18px 16px}

/* Rollenumschalter */
.rollen{display:flex;gap:8px;margin-bottom:20px}
.rollen[hidden]{display:none}
.rolle{
  font-family:'Oswald',sans-serif;font-weight:500;font-size:14px;
  flex:1;min-height:44px;padding:10px 12px;
  border:1.5px solid var(--linie);border-radius:10px;
  background:var(--papier);color:var(--grau);cursor:pointer;
}
.rolle[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff}
.rolle:focus-visible{outline:3px solid var(--rot-hell);outline-offset:2px}

.gruppe-titel{
  font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--grau);
  margin:26px 0 10px;
}
.gruppe-titel:first-of-type{margin-top:0}

.gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}

.kachel{
  display:block;text-decoration:none;color:inherit;
  background:var(--papier);border:1px solid var(--linie);
  border-radius:var(--radius);padding:16px;
  transition:transform .12s ease,border-color .12s ease;
}
a.kachel:hover{border-color:var(--rot-hell)}
a.kachel:active{transform:scale(.985)}
a.kachel:focus-visible{outline:3px solid var(--rot-hell);outline-offset:2px}
.kachel.gesperrt{opacity:.58;cursor:default}

.kachel-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;margin-bottom:4px}
.kachel-text{font-size:14px;color:var(--grau);line-height:1.4}

.marke{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  margin-top:10px;
}
.marke::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.marke.laeuft{color:var(--laeuft)}
.marke.arbeit{color:var(--arbeit)}
.marke.geplant{color:var(--grau)}

.leer{
  background:var(--papier);border:1px dashed var(--linie);
  border-radius:var(--radius);padding:22px;text-align:center;color:var(--grau);font-size:14.5px;
}
.fuss{margin-top:28px;font-size:13px;color:var(--grau);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="streifen"></div>

</header>

<main>
  <div class="rollen" id="rollen" hidden>
    <button type="button" class="rolle" data-rolle="mitarbeiter">Baustelle</button>
    <button type="button" class="rolle" data-rolle="buero">Büro</button>
    <button type="button" class="rolle" data-rolle="chef">Leitung</button>
  </div>

  <div id="inhalt"></div>

  <p class="fuss" id="fuss"></p>
</main>

<script>
/* =======================================================================
   ANPASSEN
   ======================================================================= */

// Werkzeuge. rollen = wer es im Menü sieht. zustand = laeuft | arbeit | geplant.
// Wer "geplant" oder "arbeit" ist, wird für Mitarbeiter ausgeblendet.
const WERKZEUGE = [
  { name:"Baustellenprotokoll", datei:"protokoll.html",
    text:"Leistungen melden, Material, Fotos",
    gruppe:"Auf der Baustelle", rollen:["mitarbeiter"], zustand:"arbeit" },

  { name:"Gerätecheck", datei:"geraetecheck.html",
    text:"Zustand melden nach dem QR-Scan",
    gruppe:"Auf der Baustelle", rollen:["mitarbeiter"], zustand:"geplant" },

  { name:"Baustellendoku", datei:"baustellendoku.html",
    text:"Fotos vor, während und nach der Arbeit",
    gruppe:"Auf der Baustelle", rollen:["mitarbeiter"], zustand:"geplant" },

  { name:"Check-in", datei:"checkin.html",
    text:"An- und Abmelden auf der Baustelle",
    gruppe:"Auf der Baustelle", rollen:["mitarbeiter"], zustand:"geplant" }
];

const ZUSTAND_TEXT = { laeuft:"Läuft", arbeit:"In Arbeit", geplant:"Geplant" };

/* ======================= ab hier Technik ============================== */

const params = new URLSearchParams(location.search);
const el = id => document.getElementById(id);

// Rolle: aus URL (?r=), sonst gemerkt, sonst Mitarbeiter.
// Später kommt sie aus dem Token — n8n liefert sie mit, nicht der Browser.
let rolle = params.get("r") || localStorage.getItem("mb_rolle") || "mitarbeiter";
if (!["mitarbeiter","buero","chef"].includes(rolle)) rolle = "mitarbeiter";

const name = params.get("n") || localStorage.getItem("mb_name") || "";
if (params.get("n")) localStorage.setItem("mb_name", params.get("n"));
if (params.get("t")) localStorage.setItem("mb_token", params.get("t"));

// Umschalter nur für Büro und Leitung — die Kolonne braucht ihn nicht.
if (rolle !== "mitarbeiter") {
  el("rollen").hidden = false;
  el("rollen").querySelectorAll(".rolle").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.rolle === rolle));
    b.addEventListener("click", () => {
      rolle = b.dataset.rolle;
      localStorage.setItem("mb_rolle", rolle);
      el("rollen").querySelectorAll(".rolle").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.rolle === rolle)));
      zeichne();
    });
  });
}
localStorage.setItem("mb_rolle", rolle);

el("begruessung").textContent = name ? "Moin " + name : "Übersicht";

function sichtbar(w){
  if (!w.rollen.includes(rolle)) return false;
  // Mitarbeiter sehen nur, was wirklich läuft
  if (rolle === "mitarbeiter" && w.zustand !== "laeuft") return false;
  return true;
}

function zeichne(){
  const liste = WERKZEUGE.filter(sichtbar);
  const ziel = el("inhalt");
  ziel.innerHTML = "";

  if (!liste.length) {
    ziel.innerHTML = '<div class="leer">Noch nichts freigegeben. Die Werkzeuge kommen über den QR-Code auf der Baustelle.</div>';
    el("fuss").textContent = "";
    return;
  }

  const gruppen = [...new Set(liste.map(w => w.gruppe))];
  gruppen.forEach(g => {
    const h = document.createElement("h2");
    h.className = "gruppe-titel";
    h.textContent = g;
    ziel.appendChild(h);

    const gitter = document.createElement("div");
    gitter.className = "gitter";

    liste.filter(w => w.gruppe === g).forEach(w => {
      const offen = w.zustand === "laeuft";
      const k = document.createElement(offen ? "a" : "div");
      k.className = "kachel" + (offen ? "" : " gesperrt");
      if (offen) k.href = w.datei;

      const n = document.createElement("div");
      n.className = "kachel-name"; n.textContent = w.name;

      const t = document.createElement("div");
      t.className = "kachel-text"; t.textContent = w.text;

      const m = document.createElement("span");
      m.className = "marke " + w.zustand;
      m.textContent = ZUSTAND_TEXT[w.zustand];

      k.append(n, t, m);
      gitter.appendChild(k);
    });

    ziel.appendChild(gitter);
  });

  const offen = liste.filter(w => w.zustand === "laeuft").length;
  el("fuss").textContent = rolle === "mitarbeiter"
    ? ""
    : offen + " von " + liste.length + " einsatzbereit";
}

zeichne();
</script>
</body>
</html>
