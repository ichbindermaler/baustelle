<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auswertung &ndash; Mitarbeiter-Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rot-hell:#d81f2f;
    --rot-dunkel:#8c0f1c;
    --schwarz:#1a1a1a;
    --weiss:#ffffff;
    --grau-hell:#f4f2ef;
    --grau-rand:#e0dcd6;
    --gruen:#2e7d46;
    --gelb:#c98a1a;
    --grau-text:#666;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--grau-hell);
    color:var(--schwarz);
    line-height:1.5;
  }
  header{
    background:linear-gradient(180deg,var(--rot-hell),var(--rot-dunkel));
    color:var(--weiss);
    padding:22px 20px 26px;
    text-align:center;
  }
  header img{height:52px;display:block;margin:0 auto 10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  header h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:clamp(20px,4vw,28px);
    letter-spacing:.4px;
    margin:0;
    text-transform:uppercase;
  }
  main{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

  /* --- Zugangscode-Gate --- */
  #gate{
    max-width:340px;
    margin:60px auto;
    background:var(--weiss);
    border:1px solid var(--grau-rand);
    border-radius:8px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  #gate p{font-size:14px;color:var(--grau-text);margin:0 0 16px;}
  #gate input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--grau-rand);
    border-radius:6px;
    font-size:15px;
    margin-bottom:10px;
    text-align:center;
    letter-spacing:1px;
  }
  #gate button{
    width:100%;
    background:var(--schwarz);
    color:var(--weiss);
    border:none;
    padding:12px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:.5px;
    border-radius:6px;
    cursor:pointer;
  }
  #gate button:hover{background:var(--rot-dunkel);}
  #gate .gate-fehler{color:var(--rot-dunkel);font-size:13px;margin-top:10px;display:none;}

  /* --- Dashboard --- */
  #dashboard{display:none;}
  .lade-hinweis{text-align:center;color:var(--grau-text);padding:60px 0;font-size:14px;}

  .kennzahlen{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:24px;
  }
  .kennzahl{
    background:var(--weiss);
    border:1px solid var(--grau-rand);
    border-radius:8px;
    padding:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
  }
  .kennzahl-label{
    font-family:'Barlow Condensed',sans-serif;
    font-size:12.5px;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--grau-text);
    margin:0 0 6px;
  }
  .kennzahl-wert{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 8px;
  }
  .kennzahl-wert small{font-size:15px;font-weight:500;color:var(--grau-text);}
  .balken-hintergrund{
    height:6px;
    background:var(--grau-rand);
    border-radius:3px;
    overflow:hidden;
  }
  .balken-fuellung{
    height:100%;
    background:var(--rot-hell);
    border-radius:3px;
  }
  .kennzahl-anzahl{font-size:11.5px;color:#999;margin-top:6px;}

  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:16px;
    border-bottom:1px solid var(--grau-rand);
    padding-bottom:0;
  }
  .tab{
    background:none;
    border:none;
    padding:10px 14px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:var(--grau-text);
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab.aktiv{color:var(--rot-dunkel);border-bottom-color:var(--rot-hell);}
  .tab .anzahl-badge{
    background:var(--grau-rand);
    color:var(--schwarz);
    border-radius:10px;
    padding:1px 7px;
    font-size:11px;
    margin-left:5px;
  }
  .tab.aktiv .anzahl-badge{background:var(--rot-hell);color:var(--weiss);}

  .antwort-liste{display:flex;flex-direction:column;gap:10px;}
  .antwort{
    background:var(--weiss);
    border:1px solid var(--grau-rand);
    border-left:4px solid var(--rot-hell);
    border-radius:6px;
    padding:14px 16px;
    font-size:14.5px;
    white-space:pre-wrap;
  }
  .antwort .datum{
    display:block;
    font-size:11.5px;
    color:#999;
    margin-bottom:4px;
  }
  .keine-antworten{
    color:var(--grau-text);
    font-size:14px;
    padding:30px 0;
    text-align:center;
  }
  .fehler-box{
    background:#fdecec;
    border:1px solid #f3b9b9;
    color:var(--rot-dunkel);
    border-radius:6px;
    padding:14px 16px;
    font-size:14px;
    text-align:center;
  }
</style>
</head>

  <h1>Auswertung Mitarbeiter-Feedback</h1>
</header>

<main>

  <div id="gate">
    <p>Nur f&uuml;r B&uuml;ro. Zugangscode eingeben.</p>
    <input type="password" id="code-eingabe" placeholder="Zugangscode" autocomplete="off">
    <button id="code-absenden">Freischalten</button>
    <p class="gate-fehler" id="gate-fehler">Code falsch oder keine Verbindung. Nochmal versuchen.</p>
  </div>

  <div id="dashboard">

    <div class="kennzahlen" id="kennzahlen"></div>

    <div class="tabs" id="tabs"></div>
    <div class="antwort-liste" id="antwort-liste"></div>

  </div>

</main>

<script>
// ---- KONFIGURATION ----
const READ_WEBHOOK_URL = "https://n8n.ichbindeinmaler.de/webhook/mitarbeiter-feedback-auswertung";
const HEADER_NAME = "X-Auswertung-Token";

const BLOECKE = [
  { key: "arbeitszeiten", label: "Arbeitszeiten", skala: "arbeitszeiten_skala", text: "arbeitszeiten_text" },
  { key: "alltag",        label: "Alltag",        skala: "alltag_skala",        text: "alltag_text" },
  { key: "team",          label: "Team",          skala: "team_skala",          text: "team_text" },
  { key: "fuehrung",      label: "F\u00fchrung",      skala: "fuehrung_skala",      text: "fuehrung_text" },
  { key: "frei",          label: "Frei Schnauze", skala: null,                   text: "frei_text" }
];

const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const codeEingabe = document.getElementById('code-eingabe');
const codeAbsenden = document.getElementById('code-absenden');
const gateFehler = document.getElementById('gate-fehler');

let alleZeilen = [];
let aktiverBlock = BLOECKE[0].key;

// Packt verschiedene mögliche Antwortformen (NocoDB direkt, n8n-Wrapper, o.ä.) aus
function alsZeilenArray(daten) {
  if (Array.isArray(daten)) {
    if (daten.length > 0 && daten[0] && Array.isArray(daten[0].list)) {
      return daten[0].list;
    }
    return daten;
  }
  if (daten && Array.isArray(daten.list)) return daten.list;
  if (daten && Array.isArray(daten.rows)) return daten.rows;
  if (daten && Array.isArray(daten.data)) return daten.data;
  return [];
}

function gespeicherterCode() {
  return localStorage.getItem('auswertung_code') || '';
}

async function versuchLaden(code) {
  gateFehler.style.display = 'none';
  codeAbsenden.disabled = true;
  codeAbsenden.textContent = 'Pr\u00fcfe...';
  try {
    const res = await fetch(READ_WEBHOOK_URL, {
      headers: { [HEADER_NAME]: code }
    });
    if (!res.ok) throw new Error('Zugriff verweigert');
    const daten = await res.json();
    alleZeilen = alsZeilenArray(daten);
    localStorage.setItem('auswertung_code', code);
    gate.style.display = 'none';
    dashboard.style.display = 'block';
    render();
  } catch (err) {
    gateFehler.style.display = 'block';
    codeAbsenden.disabled = false;
    codeAbsenden.textContent = 'Freischalten';
  }
}

codeAbsenden.addEventListener('click', () => {
  const code = codeEingabe.value.trim();
  if (code) versuchLaden(code);
});
codeEingabe.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') codeAbsenden.click();
});

// Beim Laden automatisch versuchen, falls Code schon bekannt
window.addEventListener('DOMContentLoaded', () => {
  const gespeichert = gespeicherterCode();
  if (gespeichert) {
    codeEingabe.value = gespeichert;
    versuchLaden(gespeichert);
  }
});

function berechneDurchschnitt(feld) {
  const werte = alleZeilen
    .map(z => parseFloat(z[feld]))
    .filter(w => !isNaN(w) && w >= 1 && w <= 5);
  if (werte.length === 0) return null;
  const summe = werte.reduce((a, b) => a + b, 0);
  return { schnitt: summe / werte.length, anzahl: werte.length };
}

function render() {
  renderKennzahlen();
  renderTabs();
  renderAntworten();
}

function renderKennzahlen() {
  const container = document.getElementById('kennzahlen');
  container.innerHTML = '';
  BLOECKE.filter(b => b.skala).forEach(b => {
    const erg = berechneDurchschnitt(b.skala);
    const div = document.createElement('div');
    div.className = 'kennzahl';
    if (!erg) {
      div.innerHTML = '<p class="kennzahl-label">' + b.label + '</p><p class="kennzahl-wert" style="color:#bbb">&ndash;</p><p class="kennzahl-anzahl">Noch keine Antworten</p>';
    } else {
      const prozent = ((erg.schnitt - 1) / 4) * 100;
      div.innerHTML =
        '<p class="kennzahl-label">' + b.label + '</p>' +
        '<p class="kennzahl-wert">' + erg.schnitt.toFixed(1) + '<small> / 5</small></p>' +
        '<div class="balken-hintergrund"><div class="balken-fuellung" style="width:' + prozent + '%"></div></div>' +
        '<p class="kennzahl-anzahl">' + erg.anzahl + ' Antworten</p>';
    }
    container.appendChild(div);
  });
}

function renderTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = '';
  BLOECKE.forEach(b => {
    const anzahl = alleZeilen.filter(z => (z[b.text] || '').trim() !== '').length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (b.key === aktiverBlock ? ' aktiv' : '');
    btn.innerHTML = b.label + ' <span class="anzahl-badge">' + anzahl + '</span>';
    btn.addEventListener('click', () => { aktiverBlock = b.key; render(); });
    container.appendChild(btn);
  });
}

function renderAntworten() {
  const container = document.getElementById('antwort-liste');
  container.innerHTML = '';
  const block = BLOECKE.find(b => b.key === aktiverBlock);
  const eintraege = alleZeilen
    .filter(z => (z[block.text] || '').trim() !== '')
    .sort((a, b) => (b.eingegangen_am || '').localeCompare(a.eingegangen_am || ''));

  if (eintraege.length === 0) {
    container.innerHTML = '<p class="keine-antworten">Noch keine Freitext-Antworten in diesem Block.</p>';
    return;
  }

  eintraege.forEach(z => {
    const div = document.createElement('div');
    div.className = 'antwort';
    const datum = z.eingegangen_am ? '<span class="datum">' + z.eingegangen_am + '</span>' : '';
    div.innerHTML = datum + escapeHtml(z[block.text]);
    container.appendChild(div);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>

</body>
</html>
